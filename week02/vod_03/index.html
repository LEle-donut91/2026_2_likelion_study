<!doctype html>
<html>
  <head>
    <title>HTML 태그 알아보기</title>
  </head>
  <body>
    <header>
      페이지 헤더
      <nav>
        <ul>
          <li>
            <a href="#">홈</a>
          </li>
          <li>
            <a href="#">소개</a>
          </li>
          <li>
            <a href="#">게시판</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>h1 제목입니다.</h1>
      <h2>h2 제목입니다.</h2>
      <h3>h3 제목입니다.</h3>
      <h4>h4 제목입니다.</h4>
      <h5>h5 제목입니다.</h5>
      <h6>h6 제목입니다.</h6>

      <p>단락을 의미합니다.</p>
      <em>기울어진 강조</em>
      <br />
      <strong>두꺼운 강조</strong>
      <br />
      <a href="www.https://google.com" target="_blank"> 구글로 이동 </a>
      <br />
      <img src="https://picsum.photos/200" />

      <ul>
        <li>HTML 배우기</li>
        <li>CSS 배우기</li>
        <li>JavaScript 배우기</li>
      </ul>

      <ol>
        <li>아침 기상</li>
        <li>아침 식사</li>
        <li>출근 준비</li>
      </ol>

      <hr />

      <table border="1">
        <tr>
          <th>이름</th>
          <th>나이</th>
        </tr>
        <tr>
          <td>Alice</td>
          <td>20</td>
        </tr>
        <tr>
          <td>Bob</td>
          <td>25</td>
        </tr>
      </table>
      <hr />

      <div>
        <input placeholder="값을 입력해주세요..." />
      </div>
      <textarea placeholder="여러 값을 입력해주세요..."></textarea>

      <select>
        <option>A</option>
        <option>B</option>
        <option>C</option>
      </select>

      <button>제출</button>
      <hr />
    </main>

    <footer>푸터입니다.</footer>
  </body>
</html>
