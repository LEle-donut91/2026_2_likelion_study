<!doctype html>
<html>
  <head>
    <title>CSS 실습</title>
    <link rel="stylesheet" href="./step5.css" />
  </head>
  <body>
    <h2>텍스트 스타일</h2>
    <div class="text-style">다양한 스타일의 텍스트</div>

    <h2>박스의 크기와 배경색</h2>
    <div class="box-style"></div>
    <div class="hex-style"></div>

    <h2>박스의 테두리</h2>
    <div class="box-border"></div>
    <br />

    <div class="box-border dashed"></div>
    <br />
    <div class="box-border dotted"></div>
    <br />
    <div class="box-border double"></div>

    <h2>박스의 여백 (패딩, 마진)</h2>
    <div class="box-padding">패딩이 있는 박스</div>
    <div class="box-margin">마진이 있는 박스</div>

    <h2>박스 사이징</h2>
    <div class="content-box"></div>
    <br />
    <div class="border-box"></div>

    <h2>블록과 인라인</h2>
    <div class="box-border box-inline">Div1</div>
    <div class="box-border box-inline">Div2</div>
    <div class="box-border box-inline">Div3</div>
    <div class="box-border box-inline">Div4</div>
    <br />

    <span class="box-block">Span1</span>
    <span class="box-block">Span2</span>
    <span class="box-block">Span3</span>
    <span class="box-block">Span4</span>
  </body>
</html>
